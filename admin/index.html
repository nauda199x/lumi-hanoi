<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị tin đăng | Lumi Hanoi</title><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
  <link rel="icon" href="/favicon.svg?v=20260828" type="image/svg+xml"><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="stylesheet" href="/assets/css/site.css?v=20260829-type"><link rel="stylesheet" href="/assets/css/marketplace.css?v=20260829-delete">
</head>
<body>
  <header class="site-header"><div class="container nav"><a class="brand" href="/" aria-label="Lumi Hanoi – Trang chủ"><span class="brand-mark" aria-hidden="true">LH</span><span>LUMI HANOI</span></a><a class="btn" href="/">Về website</a></div></header>
  <main id="main" class="admin-page" data-marketplace-admin>
    <section class="admin-login" data-admin-login><p class="eyebrow">Khu vực riêng</p><h1>Quản trị tin đăng</h1><p>Chỉ tài khoản đã được cấp quyền mới có thể xem và duyệt dữ liệu.</p><form data-admin-login-form><div class="field"><label for="admin-email">Email quản trị</label><input id="admin-email" name="email" type="email" autocomplete="username" required></div><div class="field"><label for="admin-password">Mật khẩu</label><input id="admin-password" name="password" type="password" autocomplete="current-password" required></div><p class="form-status" data-admin-login-status hidden role="status"></p><button class="btn btn-primary" type="submit">Đăng nhập</button></form></section>
    <section class="container admin-dashboard" data-admin-dashboard hidden><div class="admin-topbar"><div><p class="eyebrow">Lumi Hanoi Marketplace</p><h1>Duyệt tin đăng</h1></div><button class="btn" type="button" data-admin-logout>Đăng xuất</button></div><p class="form-status" data-admin-status hidden role="status"></p><div class="admin-kpis"><div class="admin-kpi"><strong data-kpi="pending">0</strong><span>Chờ duyệt</span></div><div class="admin-kpi"><strong data-kpi="approved">0</strong><span>Đang hiển thị</span></div><div class="admin-kpi"><strong data-kpi="done">0</strong><span>Đã giao dịch/hết hạn</span></div><div class="admin-kpi"><strong data-kpi="reports">0</strong><span>Báo cáo từ khách</span></div></div><form class="admin-filters" data-admin-filters><div class="field"><label for="admin-search">Tìm tin</label><input id="admin-search" name="keyword" type="search" placeholder="Mã tin, tòa, tên, số điện thoại"></div><div class="field"><label for="admin-status-filter">Trạng thái</label><select id="admin-status-filter" name="status"><option value="">Tất cả</option><option value="pending">Chờ duyệt</option><option value="approved">Đang hiển thị</option><option value="rejected">Từ chối</option><option value="sold">Đã bán</option><option value="rented">Đã thuê</option><option value="expired">Hết hạn</option></select></div><div class="field"><label for="admin-type-filter">Loại giao dịch</label><select id="admin-type-filter" name="type"><option value="">Tất cả</option><option value="sale">Mua bán</option><option value="rent">Cho thuê</option></select></div></form><div class="admin-list" data-admin-list></div></section>
    <dialog class="admin-dialog" data-admin-dialog><div class="admin-dialog-head"><div><p class="eyebrow" data-dialog-code>Tin đăng</p><h2>Kiểm tra và chỉnh sửa</h2></div><button class="admin-dialog-close" type="button" data-dialog-close aria-label="Đóng">×</button></div><div class="admin-dialog-body"><div data-dialog-reports></div><form data-admin-edit-form><input type="hidden" name="id"><div class="field"><label>Tiêu đề</label><input name="title" required maxlength="180"></div><div class="field-row field-row--3"><div class="field"><label>Giá (đồng)</label><input name="price_vnd" type="number" required></div><div class="field"><label>Phân khu</label><input name="phase" required></div><div class="field"><label>Tòa</label><input name="tower" required></div></div><div class="field-row field-row--3"><div class="field"><label>Loại căn</label><input name="unit_type" required></div><div class="field"><label>Diện tích</label><input name="area_sqm" type="number" step="0.1" required></div><div class="field"><label>Tầng</label><input name="floor_label"></div></div><div class="field-row"><div class="field"><label>Người đăng</label><input name="poster_name" required></div><div class="field"><label>Điện thoại</label><input name="contact_phone" required></div></div><div class="field"><label>Mô tả</label><textarea name="description" maxlength="3000"></textarea></div><div class="admin-dialog-actions"><button class="btn" type="button" data-dialog-close>Hủy</button><button class="btn btn-primary" type="submit">Lưu chỉnh sửa</button></div></form></div></dialog>
  </main>
  <script src="/assets/js/site.js" defer></script><script src="/assets/js/marketplace-config.js"></script><script src="/assets/js/marketplace-api.js?v=20260829-delete"></script><script src="/assets/js/marketplace-admin.js?v=20260829-delete" defer></script>
</body>
</html>
