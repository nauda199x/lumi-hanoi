name: Generate PDF floor-plan assets

on:
  push:
    branches: [feat/pdf-floorplans-v8-3]
    paths:
      - 'scripts/generate_pdf_floorplan_media.py'
      - '.github/workflows/generate-pdf-floorplan-assets.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pdf-floorplans-v8-3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer dependencies
        run: pip install --disable-pip-version-check PyMuPDF Pillow requests
      - name: Render missing PDF floor plans
        run: python scripts/generate_pdf_floorplan_media.py
      - name: Commit generated WebP assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media/prestige/floor-plans/p1-t30.webp \
                  assets/media/prestige/floor-plans/p2-t30.webp \
                  assets/media/elite/floor-plans/e1-t29.webp \
                  assets/media/elite/floor-plans/e2-t24.webp \
                  assets/media/elite/floor-plans/e2-t29.webp
          if git diff --cached --quiet; then
            echo "Generated assets are already current."
            exit 0
          fi
          git commit -m "Generate PDF floor-plan WebP assets [generated]"
          git push origin HEAD:feat/pdf-floorplans-v8-3
