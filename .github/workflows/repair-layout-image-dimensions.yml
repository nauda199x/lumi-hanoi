name: Repair layout image dimensions

on:
  push:
    branches: [main]
    paths:
      - "scripts/fix_layout_image_dimensions.py"
      - ".github/workflows/repair-layout-image-dimensions.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-layout-image-dimensions
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Add intrinsic image dimensions
        run: python scripts/fix_layout_image_dimensions.py
      - name: Validate repaired pages
        run: python scripts/qa_visual_v7.py
      - name: Commit repaired pages
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Layout image dimensions already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add can-ho-1-phong-ngu-lumi-hanoi/index.html \
                  can-ho-2-phong-ngu-lumi-hanoi/index.html \
                  can-ho-3-phong-ngu-lumi-hanoi/index.html \
                  duplex-penthouse-lumi-hanoi/index.html
          git commit -m "fix: add intrinsic dimensions to floor-plan images"
          git pull --rebase origin main
          git push origin HEAD:main
