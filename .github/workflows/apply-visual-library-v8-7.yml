name: Apply visual library V8.7

on:
  push:
    branches:
      - feat/visual-library-v8-7

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/visual-library-v8-7
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media dependencies
        run: python -m pip install --quiet pillow requests
      - name: Generate optimized WebP library
        run: python scripts/generate_visual_library_v8_7.py
      - name: Apply visual sections
        run: python scripts/apply_visual_library_v8_7.py
      - name: Commit generated media and pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media/signature/indoor assets/media/elite/visual-library phoi-canh-lumi-signature/index.html lumi-signature/index.html toa-signature-1-lumi-hanoi/index.html toa-signature-2-lumi-hanoi/index.html toa-signature-3-lumi-hanoi/index.html lumi-elite/index.html toa-elite-1-lumi-hanoi/index.html toa-elite-2-lumi-hanoi/index.html
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "V8.7: add local Signature and Elite visual library"
          git push origin HEAD:feat/visual-library-v8-7
