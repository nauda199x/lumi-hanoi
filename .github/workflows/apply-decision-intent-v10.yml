name: Apply V10 decision-intent links

on:
  push:
    branches: [seo/v10-decision-intent-batch]
    paths:
      - '.github/workflows/apply-decision-intent-v10.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/v10-decision-intent-batch
          fetch-depth: 0
      - name: Patch news hub and sitemap
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('tin-tuc/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<span>Hướng dẫn cư dân</span>', '<span>Hướng dẫn cư dân</span><span>Chọn tòa &amp; loại căn</span>')
          marker='      <h2>Mua bán &amp; chuyển nhượng</h2>'
          block='''      <h2>Chọn tòa &amp; nhu cầu sử dụng</h2>
      <div class="news-grid">
        <article class="card"><div><p class="eyebrow">Prestige</p><h3>P1 hay P2 nên chọn tòa nào?</h3><p>So đúng nhóm tầng, layout và vị trí căn trước khi biến P1/P2 thành một bảng xếp hạng đơn giản.</p></div><a class="card-link" href="/tin-tuc/p1-hay-p2-lumi-prestige-nen-chon-toa-nao/">So P1 và P2 →</a></article>
        <article class="card"><div><p class="eyebrow">Elite</p><h3>E1 hay E2 khác nhau thế nào?</h3><p>Đối chiếu các nhóm tầng đặc biệt, tiện ích và cách chọn căn theo nhu cầu ở thực.</p></div><a class="card-link" href="/tin-tuc/e1-hay-e2-lumi-elite-khac-nhau-the-nao/">So E1 và E2 →</a></article>
        <article class="card"><div><p class="eyebrow">Ở hay cho thuê</p><h3>Nên chọn loại căn nào?</h3><p>Khung chọn 1PN–4PN, Duplex/Penthouse theo công năng và khả năng vận hành, không dựng lợi suất.</p></div><a class="card-link" href="/tin-tuc/mua-lumi-hanoi-de-o-hay-cho-thue-nen-chon-loai-can-nao/">Chọn loại căn →</a></article>
        <article class="card"><div><p class="eyebrow">Tầng · hướng · view</p><h3>Cách chọn căn bằng masterplan và mặt bằng tầng</h3><p>Đọc đúng tầng chuyển tiếp, hướng ban công, khoảng nhìn và vị trí lõi thang trước khi so căn.</p></div><a class="card-link" href="/tin-tuc/chon-tang-huong-view-lumi-hanoi-khi-mua-can-ho/">Đọc cẩm nang →</a></article>
      </div>

'''
          if '/tin-tuc/p1-hay-p2-lumi-prestige-nen-chon-toa-nao/' not in s:
              s=s.replace(marker, block+marker)
          p.write_text(s,encoding='utf-8')

          p=Path('sitemap.xml')
          s=p.read_text(encoding='utf-8')
          entries=[
            '  <url><loc>https://lumi-hanoi.com/tin-tuc/p1-hay-p2-lumi-prestige-nen-chon-toa-nao/</loc><lastmod>2026-08-24</lastmod><priority>0.8</priority></url>',
            '  <url><loc>https://lumi-hanoi.com/tin-tuc/e1-hay-e2-lumi-elite-khac-nhau-the-nao/</loc><lastmod>2026-08-24</lastmod><priority>0.8</priority></url>',
            '  <url><loc>https://lumi-hanoi.com/tin-tuc/mua-lumi-hanoi-de-o-hay-cho-thue-nen-chon-loai-can-nao/</loc><lastmod>2026-08-24</lastmod><priority>0.8</priority></url>',
            '  <url><loc>https://lumi-hanoi.com/tin-tuc/chon-tang-huong-view-lumi-hanoi-khi-mua-can-ho/</loc><lastmod>2026-08-24</lastmod><priority>0.8</priority></url>',
          ]
          missing=[e for e in entries if e.split('<loc>')[1].split('</loc>')[0] not in s]
          if missing:
              s=s.replace('</urlset>', '\n'.join(missing)+'\n</urlset>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit hub updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tin-tuc/index.html sitemap.xml
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'V10: surface decision-intent articles in news hub'
            git push origin HEAD:seo/v10-decision-intent-batch
          fi