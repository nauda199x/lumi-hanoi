name: Apply amenity scope V8.8

on:
  push:
    branches:
      - fix/amenity-source-scope-v8-8

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/amenity-source-scope-v8-8
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source-scope reconciliation
        run: python scripts/apply_amenity_scope_v8_8.py
      - name: Commit page update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tien-ich-lumi-hanoi/index.html
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "V8.8: reconcile amenity counts by source scope"
          git push origin HEAD:fix/amenity-source-scope-v8-8
