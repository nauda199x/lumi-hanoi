name: Relocate phase layout previews once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/relocate-phase-layouts-once.yml'

permissions:
  contents: write

jobs:
  relocate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Move Signature and Elite layout previews directly below hero
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('mat-bang-lumi-hanoi/index.html')
          html = path.read_text(encoding='utf-8')
          pattern = re.compile(r'<!-- PHASE-UNIT-LAYOUTS:START -->.*?<!-- PHASE-UNIT-LAYOUTS:END -->', re.S)
          match = pattern.search(html)
          if not match:
              raise SystemExit('Phase layout block not found')
          block = match.group(0)
          html = html[:match.start()] + html[match.end():]

          needle = '</nav></div></header><section class="section floor-hub-intro">'
          if needle not in html:
              raise SystemExit('Hero/floor-hub insertion point not found')
          html = html.replace(
              needle,
              '</nav></div></header>' + block + '<section class="section floor-hub-intro">',
              1,
          )

          if html.count('id="phase-unit-layouts"') != 1:
              raise SystemExit('phase-unit-layouts id must remain unique')
          if html.index('id="phase-unit-layouts"') > html.index('class="section floor-hub-intro"'):
              raise SystemExit('Phase layout block was not moved above floor hub intro')
          path.write_text(html, encoding='utf-8')
          PY

      - name: Run repository QA
        run: npm test

      - name: Commit relocation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mat-bang-lumi-hanoi/index.html
          git commit -m 'fix: surface Signature and Elite layouts above fold'
          git pull --rebase origin main
          git push origin HEAD:main
