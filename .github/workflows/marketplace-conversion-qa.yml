name: Marketplace Conversion QA

on:
  pull_request:
    paths:
      - "scripts/enhance_marketplace_conversion.py"
      - "scripts/qa_marketplace_conversion.py"
      - "assets/js/marketplace-conversion.js"
      - "assets/js/saved-listings.js"
      - "assets/css/marketplace-conversion.css"
      - "tin-da-luu-lumi-hanoi/index.html"
      - ".github/workflows/marketplace-conversion-qa.yml"
      - ".github/workflows/sync-marketplace-seo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conversion-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate syntax
        run: |
          python -m py_compile scripts/enhance_marketplace_conversion.py
          python -m py_compile scripts/qa_marketplace_conversion.py
          node --check assets/js/marketplace-conversion.js
          node --check assets/js/saved-listings.js
      - name: Run 3F conversion QA
        run: python scripts/qa_marketplace_conversion.py
