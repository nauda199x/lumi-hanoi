name: Optimize Lumi marketplace hero photos

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/optimize-marketplace-hero-photos.yml"

permissions:
  contents: write

concurrency:
  group: optimize-lumi-marketplace-heroes
  cancel-in-progress: false

jobs:
  optimize-photos:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Create compact responsive Lumi photos
        run: python scripts/optimize_marketplace_heroes.py
      - name: Commit optimized assets and safe hero reference changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media/handover-2026/*-hero-lite*.webp \
            assets/css/marketplace-real-heroes.css \
            dang-tin-lumi-hanoi/index.html \
            mua-ban-lumi-hanoi/index.html \
            cho-thue-lumi-hanoi/index.html
          if git diff --cached --quiet; then
            echo "Lightweight heroes already synchronized."
          else
            git commit -m "perf: deploy compact real-photo marketplace hero variants"
            git push origin HEAD:main
          fi
