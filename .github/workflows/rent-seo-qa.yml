name: Rental SEO QA

on:
  pull_request:
    paths:
      - "scripts/generate_rent_category_seo.py"
      - ".github/workflows/sync-marketplace-seo.yml"
      - ".github/workflows/rent-seo-qa.yml"

permissions:
  contents: read

jobs:
  rental-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate generator syntax
        run: python -m py_compile scripts/generate_rent_category_seo.py
      - name: Generate rental intent pages
        run: python scripts/generate_rent_category_seo.py
      - name: Validate generated pages and sitemap
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          pages = [
              "cho-thue-can-ho-1-phong-ngu-lumi-hanoi/index.html",
              "cho-thue-can-ho-2-phong-ngu-lumi-hanoi/index.html",
              "cho-thue-can-ho-3-phong-ngu-lumi-hanoi/index.html",
              "cho-thue-can-ho-4-phong-ngu-lumi-hanoi/index.html",
              "cho-thue-duplex-lumi-hanoi/index.html",
              "cho-thue-penthouse-lumi-hanoi/index.html",
          ]
          for page in pages:
              raw = Path(page).read_text(encoding="utf-8")
              if '<meta name="robots" content="index,follow,max-image-preview:large">' not in raw:
                  raise SystemExit(f"missing index robots: {page}")
              if '<link rel="canonical" href="https://lumi-hanoi.com/' not in raw:
                  raise SystemExit(f"missing canonical: {page}")
              if 'application/ld+json' not in raw:
                  raise SystemExit(f"missing schema: {page}")
          ET.parse("sitemap.xml")
          hub = Path("cho-thue-lumi-hanoi/index.html").read_text(encoding="utf-8")
          if "RENT-SEO-CLUSTER:START" not in hub:
              raise SystemExit("rental hub is missing SEO cluster")
          print("Rental SEO pages: OK")
          PY
