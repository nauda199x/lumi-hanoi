name: Rental SEO QA

on:
  pull_request:
    paths:
      - "scripts/generate_rent_category_seo.py"
      - "scripts/strengthen_rent_hub_seo.py"
      - "scripts/consolidate_rent_hub_serp.py"
      - "scripts/generate_rent_tower_seo.py"
      - "scripts/strengthen_rent_cluster_3h.py"
      - "scripts/qa_rent_cluster_3h.py"
      - "assets/js/marketplace-entity-loop.js"
      - ".github/workflows/sync-marketplace-seo.yml"
      - ".github/workflows/rent-seo-qa.yml"

permissions:
  contents: read

jobs:
  rental-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate rental SEO syntax
        run: |
          python -m py_compile scripts/generate_rent_category_seo.py
          python -m py_compile scripts/strengthen_rent_hub_seo.py
          python -m py_compile scripts/consolidate_rent_hub_serp.py
          python -m py_compile scripts/generate_rent_tower_seo.py
          python -m py_compile scripts/strengthen_rent_cluster_3h.py
          python -m py_compile scripts/qa_rent_cluster_3h.py
          node --check assets/js/marketplace-entity-loop.js
      - name: Run 3H rental SEO QA
        run: python scripts/qa_rent_cluster_3h.py
      - name: Keep primary rental hub intent stable
        run: |
          python - <<'PY'
          from pathlib import Path
          hub=Path('cho-thue-lumi-hanoi/index.html').read_text(encoding='utf-8')
          for token in ('<title>Cho Thuê Căn Hộ Chung Cư Lumi Hanoi Giá Tốt ','RENT-SEO-CLUSTER:START','RENT-PHASE-CLUSTER:START','RENT-TOWER-CLUSTER:START','<meta name="robots" content="index,follow,max-image-preview:large">'):
              if token not in hub:
                  raise SystemExit(f'rental hub regression: {token}')
          print('Primary rental hub intent: OK')
          PY
