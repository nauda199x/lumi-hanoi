name: Apply Signature floorplan V8.4

on:
  push:
    branches:
      - feat/signature-penthouse-seo-v8-4

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/signature-penthouse-seo-v8-4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply V8.4 SEO and media references
        env:
          PAYLOAD: 
        run: |
          python - <<'PY'
          import os,base64,zlib
          open('/tmp/apply_v84.py','wb').write(zlib.decompress(base64.b64decode(os.environ['PAYLOAD'])))
          PY
          python /tmp/apply_v84.py
      - name: Commit generated text changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toa-signature-1-lumi-hanoi/index.html toa-signature-2-lumi-hanoi/index.html toa-signature-3-lumi-hanoi/index.html toa-signature-5-lumi-hanoi/index.html toa-signature-6-lumi-hanoi/index.html mat-bang-lumi-hanoi/index.html assets/css/floor-plan-hub.css scripts/qa_signature_penthouse_v8_4.py .github/workflows/repo-qa.yml
          git commit -m "V8.4: enrich Signature tower SEO and penthouse views"
          git push origin HEAD:feat/signature-penthouse-seo-v8-4
