name: Prioritize floor-plan SEO cluster

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/prioritize-floorplan-seo.yml'
      - 'scripts/prioritize_floorplan_serp_images.py'
      - 'scripts/prioritize_floorplan_serp_images_v2.py'
      - 'scripts/prioritize_floorplan_serp_images_v3.py'

permissions:
  contents: write

concurrency:
  group: prioritize-floorplan-seo-main
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Localize representative floor plans and align SERP signals
        run: python scripts/prioritize_floorplan_serp_images_v3.py

      - name: Verify SERP image signals
        run: python scripts/qa_serp_image_signals.py

      - name: Run repository QA
        run: npm test

      - name: Commit prioritized floor-plan cluster
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets/data/floor-plans.json \
            assets/media/signature/floor-plans \
            assets/media/prestige/floor-plans \
            assets/media/elite/floor-plans \
            mat-bang-lumi-hanoi/lumi-signature/s1/index.html \
            mat-bang-lumi-hanoi/lumi-signature/s2/index.html \
            mat-bang-lumi-hanoi/lumi-signature/s3/index.html \
            mat-bang-lumi-hanoi/lumi-signature/s5/index.html \
            mat-bang-lumi-hanoi/lumi-signature/s6/index.html \
            mat-bang-lumi-hanoi/lumi-prestige/p1/index.html \
            mat-bang-lumi-hanoi/lumi-prestige/p2/index.html \
            mat-bang-lumi-hanoi/lumi-elite/e1/index.html \
            mat-bang-lumi-hanoi/lumi-elite/e2/index.html \
            sitemap-images.xml
          if git diff --cached --quiet; then
            echo 'No floor-plan SEO changes to commit.'
            exit 0
          fi
          git commit -m 'feat: prioritize representative floor-plan SEO images'
          git pull --rebase origin main
          git push origin HEAD:main
