name: Apply SEO V10 internal links

on:
  push:
    branches: [seo/v10-capitaland-authority]
    paths:
      - '.github/workflows/apply-seo-v10-links.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/v10-capitaland-authority
          fetch-depth: 0
      - name: Patch news hub, overview and sitemap
        run: |
          python - <<'PY'
          from pathlib import Path

          # News hub: surface the new entity cluster.
          p = Path('tin-tuc/index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('<span>Hướng dẫn cư dân</span>', '<span>Hướng dẫn cư dân</span>\n                <span>Chủ đầu tư CapitaLand</span>')
          marker = '              <h2>Khám phá theo nhu cầu</h2>'
          block = '''              <h2>Chủ đầu tư &amp; dấu ấn CapitaLand</h2>
              <div class="news-grid">
                <article class="card"><div><p class="eyebrow">Hồ sơ chủ đầu tư</p><h3>CapitaLand Development tại Việt Nam</h3><p>Hơn 30 năm hiện diện, danh mục hơn 19.000 căn nhà và cách đọc track record trước khi đánh giá Lumi Hanoi.</p></div><a class="card-link" href="/chu-dau-tu-capitaland/">Xem hồ sơ →</a></article>
                <article class="card"><div><p class="eyebrow">Dự án tiêu biểu</p><h3>Từ The Vista đến Heritage West Lake</h3><p>Ảnh và dữ liệu các dự án nổi bật của CapitaLand tại Việt Nam, từ TP.HCM đến Hà Nội.</p></div><a class="card-link" href="/tin-tuc/capitaland-tai-viet-nam-cac-du-an-noi-bat/">Xem các dự án →</a></article>
                <article class="card"><div><p class="eyebrow">Track record</p><h3>Các dự án CapitaLand đã bàn giao</h3><p>Chỉ dùng dự án có trạng thái hoàn thành, vận hành hoặc mốc bàn giao do CapitaLand công bố.</p></div><a class="card-link" href="/tin-tuc/cac-du-an-capitaland-da-ban-giao-tai-viet-nam/">Đọc track record →</a></article>
                <article class="card"><div><p class="eyebrow">Hà Nội</p><h3>Từ Heritage West Lake đến Lumi Hanoi</h3><p>Nhìn cách CapitaLand mở rộng từ dự án 173 căn bên Hồ Tây sang các tổ hợp hơn 2.000–3.000 căn.</p></div><a class="card-link" href="/tin-tuc/capitaland-tai-ha-noi-tu-heritage-west-lake-den-lumi-hanoi/">Đọc bài →</a></article>
              </div>
'''
          if '/chu-dau-tu-capitaland/' not in text and marker in text:
              text = text.replace(marker, block + marker)
          p.write_text(text, encoding='utf-8')

          # Project overview: add one contextual entity link near the top.
          p = Path('tong-quan-lumi-hanoi/index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<h2>Bảng dữ liệu dự án</h2>'
          insert = '<p>Để đánh giá nền tảng phát triển đứng sau dự án, xem thêm <a href="/chu-dau-tu-capitaland/">hồ sơ CapitaLand Development tại Việt Nam</a> và các dự án đã hoàn thành trước Lumi Hanoi.</p>'
          if '/chu-dau-tu-capitaland/' not in text and marker in text:
              text = text.replace(marker, insert + marker)
          p.write_text(text, encoding='utf-8')

          # Sitemap: add the pillar and three supporting articles.
          p = Path('sitemap.xml')
          text = p.read_text(encoding='utf-8')
          entries = [
            '  <url><loc>https://lumi-hanoi.com/chu-dau-tu-capitaland/</loc><lastmod>2026-08-24</lastmod><priority>0.9</priority></url>',
            '  <url><loc>https://lumi-hanoi.com/tin-tuc/capitaland-tai-viet-nam-cac-du-an-noi-bat/</loc><lastmod>2026-08-24</lastmod><priority>0.8</priority></url>',
            '  <url><loc>https://lumi-hanoi.com/tin-tuc/cac-du-an-capitaland-da-ban-giao-tai-viet-nam/</loc><lastmod>2026-08-24</lastmod><priority>0.8</priority></url>',
            '  <url><loc>https://lumi-hanoi.com/tin-tuc/capitaland-tai-ha-noi-tu-heritage-west-lake-den-lumi-hanoi/</loc><lastmod>2026-08-24</lastmod><priority>0.8</priority></url>',
          ]
          missing = [e for e in entries if e.split('<loc>')[1].split('</loc>')[0] not in text]
          if missing:
              text = text.replace('</urlset>', '\n'.join(missing) + '\n</urlset>')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit V10 linking changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tin-tuc/index.html tong-quan-lumi-hanoi/index.html sitemap.xml
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'V10: connect CapitaLand SEO cluster internally'
            git push origin HEAD:seo/v10-capitaland-authority
          fi
