name: Build homepage overview hero

on:
  push:
    branches:
      - fix/home-hero-overview
    paths:
      - .github/workflows/build-home-hero.yml

permissions:
  contents: write

jobs:
  build-hero:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-hero-overview
          fetch-depth: 0

      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          python -m pip install pillow gdown

      - name: Download source and extract clean overview
        run: |
          mkdir -p /tmp/lumi-p23
          python -m gdown 1zJb_lQ4s8FGmwumRD9lOU4CNacLS4cx- -O /tmp/lumi-elite-training.pdf
          pdfimages -f 23 -l 23 -j /tmp/lumi-elite-training.pdf /tmp/lumi-p23/img
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          files = sorted(Path('/tmp/lumi-p23').glob('img-*.jpg'))
          if len(files) < 7:
              raise SystemExit(f'Expected at least 7 JPEG strips on page 23, found {len(files)}')
          # The first seven JPEGs form the clean panoramic project rendering.
          files = files[:7]
          imgs = [Image.open(p).convert('RGB') for p in files]
          width = max(im.width for im in imgs)
          height = sum(im.height for im in imgs)
          canvas = Image.new('RGB', (width, height))
          y = 0
          for im in imgs:
              canvas.paste(im, (0, y))
              y += im.height
          canvas = canvas.resize((1600, 900), Image.Resampling.LANCZOS)
          out = Path('assets/media/home/lumi-hanoi-overview.webp')
          out.parent.mkdir(parents=True, exist_ok=True)
          canvas.save(out, 'WEBP', quality=72, method=6)

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          replacement = '<img class="home-hero-media" src="/assets/media/home/lumi-hanoi-overview.webp" width="1600" height="900" alt="Phối cảnh toàn cảnh các tòa tháp Lumi Hanoi" fetchpriority="high" decoding="async">'
          text, n = re.subn(r'<img class="home-hero-media"[^>]*>', replacement, text, count=1)
          if n != 1:
              raise SystemExit('Could not replace homepage hero image tag')
          index.write_text(text, encoding='utf-8')
          PY

      - name: Commit local hero and remove temporary workflow
        run: |
          rm .github/workflows/build-home-hero.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/media/home/lumi-hanoi-overview.webp .github/workflows/build-home-hero.yml
          git commit -m "Add clean local Lumi Hanoi overview hero"
          git push origin HEAD:fix/home-hero-overview
