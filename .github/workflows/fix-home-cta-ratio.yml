name: Fix homepage CTA ratio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-home-cta-ratio.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make mobile CTA proportions robust
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old1 = '.home-hero .home-market-secondary{display:flex!important;align-items:stretch!important;gap:10px!important;width:100%!important;min-width:0!important}'
          new1 = '.home-hero .home-market-secondary{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;align-items:stretch!important;gap:10px!important;width:100%!important;min-width:0!important}'

          old2 = '.home-hero .home-market-secondary>.btn{display:flex!important;flex:1 1 0!important;width:0!important;max-width:none!important;min-width:0!important;min-height:54px!important;margin:0!important;padding:0 8px!important;border-radius:16px!important;font-size:.94rem!important;font-weight:800!important;line-height:1.15!important;text-align:center!important;white-space:normal!important;overflow:visible!important;justify-content:center!important}'
          new2 = '.home-hero .home-market-secondary>.btn{display:flex!important;width:100%!important;max-width:none!important;min-width:0!important;min-height:54px!important;margin:0!important;padding:0 10px!important;box-sizing:border-box!important;border-radius:16px!important;font-size:.94rem!important;font-weight:800!important;line-height:1.15!important;text-align:center!important;white-space:normal!important;overflow:visible!important;align-items:center!important;justify-content:center!important}'

          if old1 not in s or old2 not in s:
              raise SystemExit('Expected CTA CSS not found; aborting without modifying index.html')

          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/fix-home-cta-ratio.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-home-cta-ratio.yml
          git commit -m "Polish homepage mobile CTA proportions"
          git push origin main
