name: Repository QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run SEO and visual regression suites
        run: |
          python scripts/qa_seo_v5.py
          python scripts/qa_seo_v5_1.py
          python scripts/qa_seo_v6.py
          python scripts/qa_visual_v7.py
          python scripts/qa_editorial_v7_1.py
          python scripts/qa_prestige_v8_1a.py
          python scripts/qa_prestige_v8_1b.py
          python scripts/qa_prestige_v8_1c.py
          python scripts/qa_prestige_v8_1d.py
          python scripts/qa_floorplans_v8_2.py
          python scripts/qa_handover_v8_6.py
          python scripts/qa_visual_library_v8_7.py
          python scripts/qa_amenity_scope_v8_8.py
          python scripts/qa_responsive_v9.py
          python scripts/qa_brand_meta_v10_1.py
          python scripts/qa_legacy_redirects_v10_2.py
          python scripts/qa_gsc_top5_v10_3.py
          python scripts/qa_market_price_v10_4.py
          python scripts/qa_sitelink_architecture_v10_5.py
          python scripts/qa_public_source_cleanup.py
          python scripts/qa_marketplace_v1.py
      - name: Validate data and JavaScript syntax
        run: |
          python -m json.tool assets/data/floor-plans.json >/dev/null
          python -m json.tool assets/data/visual-library-v8.7.json >/dev/null
          python -m py_compile scripts/generate_marketplace_seo.py
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlparse, unquote

          main_root = ET.parse('sitemap.xml').getroot()
          listing_root = ET.parse('sitemap-tin-dang.xml').getroot()
          print('sitemap.xml: OK')
          print('sitemap-tin-dang.xml: OK')

          sm_ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          main_locs = {node.text for node in main_root.findall('.//sm:loc', sm_ns) if node.text}
          listing_locs = {node.text for node in listing_root.findall('.//sm:loc', sm_ns) if node.text}
          overlap = sorted(main_locs & listing_locs)
          if overlap:
              raise SystemExit(f'listing URLs duplicated across sitemaps: {overlap[:10]}')

          required_trust_pages = [
              'gioi-thieu/index.html',
              'lien-he/index.html',
              'chinh-sach-bao-mat/index.html',
              'dieu-khoan-su-dung/index.html',
          ]
          for page in required_trust_pages:
              if not Path(page).is_file():
                  raise SystemExit(f'missing trust page: {page}')

          ns = {
              'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9',
              'image': 'http://www.google.com/schemas/sitemap-image/1.1',
          }
          root = ET.parse('sitemap-images.xml').getroot()
          image_locs = [node.text for node in root.findall('.//image:loc', ns) if node.text]
          if not image_locs:
              raise SystemExit('sitemap-images.xml has no image entries')
          for image_url in image_locs:
              parsed = urlparse(image_url)
              if parsed.scheme != 'https' or parsed.netloc != 'lumi-hanoi.com':
                  raise SystemExit(f'invalid image URL: {image_url}')
              local = Path(unquote(parsed.path.lstrip('/')))
              if not local.is_file():
                  raise SystemExit(f'image sitemap points to missing file: {local}')
          robots = Path('robots.txt').read_text(encoding='utf-8')
          if 'Sitemap: https://lumi-hanoi.com/sitemap-images.xml' not in robots:
              raise SystemExit('robots.txt is missing sitemap-images.xml')
          print(f'sitemap-images.xml: OK ({len(image_locs)} image entries)')
          PY
          node --check assets/js/site.js
          node --check assets/js/floor-plan-tower.js
          node --check assets/js/marketplace-api.js
          node --check assets/js/marketplace-list.js
          node --check assets/js/marketplace-form.js
          node --check assets/js/marketplace-detail.js
          node --check assets/js/marketplace-admin.js
          node --check assets/js/marketplace-static-status.js
