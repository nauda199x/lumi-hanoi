name: Apply PDF floor-plan inventory

on:
  push:
    branches: [feat/pdf-floorplans-v8-3]
    paths:
      - 'scripts/apply_pdf_floorplan_inventory.py'
      - '.github/workflows/apply-pdf-floorplan-inventory.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pdf-floorplans-v8-3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply inventory and page updates
        run: python scripts/apply_pdf_floorplan_inventory.py
      - name: Run floor-plan QA
        run: |
          python scripts/qa_floorplans_v8_2.py
          node --check assets/js/floor-plan-tower.js
          python -m json.tool assets/data/floor-plans.json >/dev/null
      - name: Commit integrated floor-plan changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/floor-plans.json \
                  assets/js/floor-plan-tower.js \
                  mat-bang-lumi-hanoi/index.html \
                  toa-prestige-1-lumi-hanoi/index.html \
                  toa-prestige-2-lumi-hanoi/index.html \
                  toa-elite-1-lumi-hanoi/index.html \
                  toa-elite-2-lumi-hanoi/index.html \
                  scripts/qa_floorplans_v8_2.py
          if git diff --cached --quiet; then
            echo "Inventory is already current."
            exit 0
          fi
          git commit -m "Integrate PDF floor plans into tower lookup [generated]"
          git push origin HEAD:feat/pdf-floorplans-v8-3
