name: Refresh CapitaLand profile V10
on:
  push:
    branches: [seo/v10-capitaland-authority]
    paths:
      - '.github/workflows/refresh-capitaland-profile-v10.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/v10-capitaland-authority
          fetch-depth: 0
      - name: Refresh current 2026 portfolio figures
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('chu-dau-tu-capitaland/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Theo hồ sơ doanh nghiệp được CapitaLand công bố trong giai đoạn 2025–2026, danh mục CLD tại Việt Nam gồm một dự án SOHO, hai dự án phức hợp và hơn 19.000 căn nhà tại 19 dự án nhà ở.', 'Theo cập nhật doanh nghiệp của CapitaLand trong năm 2026, danh mục CLD tại Việt Nam gồm một dự án SOHO, một dự án phức hợp và hơn 19.000 căn nhà tại 20 dự án nhà ở. Cơ cấu danh mục thay đổi theo thời điểm khi dự án mới được bổ sung, vì vậy bài này ghi rõ ngày cập nhật thay vì coi một con số lịch sử là cố định.')
          s=s.replace('<strong>19 dự án</strong><span>Số dự án nhà ở được CLD nêu trong danh mục Việt Nam</span>', '<strong>20 dự án</strong><span>Số dự án nhà ở CLD nêu trong cập nhật doanh nghiệp năm 2026</span>')
          needle='<li><a href="https://www.capitaland.com/vn/en/about-capitaland/who-we-are.html" rel="noopener noreferrer">CapitaLand – Who We Are / CLD Vietnam</a></li>'
          extra='<li><a href="https://www.capitaland.com/en/about-capitaland/newsroom/news-releases/vietnam/2026/capitaland-development-launches-fourth-edition-of--together-we-s.html" rel="noopener noreferrer">CapitaLand – cập nhật hồ sơ CLD Việt Nam năm 2026</a></li>'
          if extra not in s:
              s=s.replace(needle, needle+'\n        '+extra)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chu-dau-tu-capitaland/index.html
          git commit -m 'V10: refresh CapitaLand Vietnam portfolio figures' || exit 0
          git push origin HEAD:seo/v10-capitaland-authority
