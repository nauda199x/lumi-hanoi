name: Flatten shared layout stylesheet

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-layout-hotfix.yml'

permissions:
  contents: write

jobs:
  flatten-site-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore QA-visible shared CSS and append layout hardening
        shell: bash
        run: |
          cat assets/css/site-base-20260907.css > assets/css/site.css
          cat >> assets/css/site.css <<'CSS'

          /* V13 global layout hardening — September 2026. */
          :root{
            --max:1400px;
            --editorial:1120px;
          }
          .container,
          .article-layout{
            max-width:1400px;
          }
          .article,
          .editorial-wide .article{
            min-width:0;
          }
          .editorial-shell.article-layout--with-sidebar{
            width:min(calc(100% - (2 * var(--page-gutter))),1400px);
            max-width:1400px;
            grid-template-columns:minmax(0,1fr) minmax(230px,270px);
            gap:clamp(30px,4vw,64px);
            justify-content:stretch;
            align-items:start;
          }
          .editorial-wide .article{
            max-width:none;
          }
          .article-layout--with-sidebar > .side-nav{
            min-width:0;
            max-width:none;
            overflow-wrap:anywhere;
          }
          .article :where(.media-gallery,.facts-grid,.progress-entry,.figure,table),
          .article .media-gallery > *{
            min-width:0;
          }
          .article table{
            max-width:100%;
          }
          @media(max-width:1120px){
            .article-layout--with-sidebar,
            .editorial-shell.article-layout--with-sidebar{
              grid-template-columns:minmax(0,1fr);
              gap:2.25rem;
            }
            .article-layout--with-sidebar > .side-nav{
              position:static;
              width:100%;
              display:grid;
              grid-template-columns:repeat(2,minmax(0,1fr));
              column-gap:1.5rem;
              align-content:start;
              padding-top:1rem;
            }
            .article-layout--with-sidebar > .side-nav > strong{
              grid-column:1/-1;
            }
          }
          @media(max-width:900px){
            .article table{
              display:block;
              width:100%;
              overflow-x:auto;
              overscroll-behavior-inline:contain;
              -webkit-overflow-scrolling:touch;
            }
          }
          @media(max-width:760px){
            :root{
              --page-gutter:clamp(16px,5vw,22px);
            }
            .container,
            .article-layout{
              width:min(calc(100% - (2 * var(--page-gutter))),100%);
            }
            .article-layout--with-sidebar > .side-nav{
              display:block;
              padding-top:0;
            }
            .media-gallery,
            .facts-grid{
              grid-template-columns:minmax(0,1fr);
            }
          }
          CSS
          grep -q 'reading-shell.article-layout--centered' assets/css/site.css
          grep -q 'V13 global layout hardening' assets/css/site.css
      - name: Commit flattened stylesheet
        shell: bash
        run: |
          if git diff --quiet -- assets/css/site.css; then
            echo "Stylesheet already flattened."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/site.css
          git commit -m "Flatten shared stylesheet after layout hardening"
          git pull --rebase origin main
          git push origin HEAD:main
