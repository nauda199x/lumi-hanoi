name: Import Lumi Hanoi unit layouts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-signature-layouts.yml'
      - 'assets/data/drive-unit-layout-import.json'

permissions:
  contents: write

concurrency:
  group: import-lumi-unit-layouts
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install downloader and image tools
        run: python -m pip install --disable-pip-version-check gdown pillow

      - name: Download and optimize unit layouts from Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/lumi-drive
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from PIL import Image

          registry = json.loads(Path('assets/data/drive-unit-layout-import.json').read_text())
          items = registry['items']
          tmp = Path('.tmp/lumi-drive')
          failures = []

          for i, item in enumerate(items, 1):
              src = tmp / f"{i:03d}-{item['sourceName'].replace('/', '-')}"
              out = Path(item['localAsset'])
              out.parent.mkdir(parents=True, exist_ok=True)
              print(f"[{i}/{len(items)}] {item['phase']} {item['scope']} :: {item['sourceName']}")
              try:
                  subprocess.run(['gdown', item['driveId'], '-O', str(src)], check=True)
                  with Image.open(src) as original:
                      im = original.convert('RGB')
                      w, h = im.size
                      scale = min(1.0, 2400 / max(w, h))
                      if scale < 1:
                          im = im.resize((round(w * scale), round(h * scale)), Image.Resampling.LANCZOS)
                      im.save(out, 'WEBP', quality=86, method=6)
                  if not out.exists() or out.stat().st_size < 10_000:
                      raise RuntimeError(f'output too small: {out}')
              except Exception as exc:
                  failures.append(f"{item['driveId']} {item['sourceName']}: {exc}")

          if failures:
              print('\nFAILED IMPORTS:')
              for failure in failures:
                  print('-', failure)
              raise SystemExit(f'{len(failures)} Drive assets failed to import')
          PY

      - name: Validate registry coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          items = json.loads(Path('assets/data/drive-unit-layout-import.json').read_text())['items']
          missing = [i['localAsset'] for i in items if not Path(i['localAsset']).is_file() or Path(i['localAsset']).stat().st_size < 10000]
          phases = {}
          for i in items:
              phases[i['phase']] = phases.get(i['phase'], 0) + 1
          print('Registered:', len(items), 'assets', phases)
          if missing:
              print('Missing:', *missing, sep='\n- ')
              raise SystemExit(1)
          PY

      - name: Commit imported assets
        run: |
          if [ -z "$(git status --porcelain -- assets/media/signature/unit-layouts assets/media/elite/unit-layouts)" ]; then
            echo 'No asset changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/media/signature/unit-layouts assets/media/elite/unit-layouts
          git commit -m 'assets: import complete Signature and Elite unit layouts from Drive'
          git pull --rebase origin main
          git push origin HEAD:main
