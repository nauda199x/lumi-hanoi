name: Import Lumi Hanoi unit layouts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-signature-layouts.yml'
      - 'assets/data/drive-unit-layout-import.json'
      - 'assets/data/drive-unit-layout-import-extra.json'
      - 'assets/data/drive-special-layout-import.json'
      - 'scripts/finalize_signature_layout_pages.py'

permissions:
  contents: write

concurrency:
  group: import-lumi-unit-layouts
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install downloader and image tools
        run: python -m pip install --disable-pip-version-check gdown pillow pymupdf

      - name: Download missing unit layouts from Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/lumi-drive
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from PIL import Image
          import fitz

          registry_paths = [
              Path('assets/data/drive-unit-layout-import.json'),
              Path('assets/data/drive-unit-layout-import-extra.json'),
              Path('assets/data/drive-special-layout-import.json'),
          ]
          items = []
          for path in registry_paths:
              items.extend(json.loads(path.read_text())['items'])

          target_paths = [item['localAsset'] for item in items]
          if len(target_paths) != len(set(target_paths)):
              raise SystemExit('Duplicate localAsset path in import registry')

          tmp = Path('.tmp/lumi-drive')
          failures = []
          downloaded = 0
          skipped = 0

          for i, item in enumerate(items, 1):
              out = Path(item['localAsset'])
              out.parent.mkdir(parents=True, exist_ok=True)
              if out.is_file() and out.stat().st_size >= 10_000:
                  needs_landscape = bool(item.get('landscape'))
                  if needs_landscape:
                      try:
                          with Image.open(out) as existing:
                              already_ready = existing.width > existing.height
                      except Exception:
                          already_ready = False
                      if already_ready:
                          print(f"[{i}/{len(items)}] SKIP existing landscape :: {out}")
                          skipped += 1
                          continue
                      print(f"[{i}/{len(items)}] REBUILD portrait -> landscape :: {out}")
                  else:
                      print(f"[{i}/{len(items)}] SKIP existing :: {out}")
                      skipped += 1
                      continue

              src = tmp / f"{i:03d}-{item['sourceName'].replace('/', '-')}"
              print(f"[{i}/{len(items)}] DOWNLOAD {item['phase']} {item['scope']} :: {item['sourceName']}")
              try:
                  subprocess.run(['gdown', item['driveId'], '-O', str(src)], check=True)
                  if src.suffix.lower() == '.pdf':
                      doc = fitz.open(src)
                      if doc.page_count < 1:
                          raise RuntimeError(f'empty PDF: {src}')
                      page = doc.load_page(0)
                      pix = page.get_pixmap(matrix=fitz.Matrix(2.0, 2.0), alpha=False)
                      im = Image.frombytes('RGB', [pix.width, pix.height], pix.samples)
                  else:
                      with Image.open(src) as original:
                          im = original.convert('RGB')
                  rotate_clockwise = int(item.get('rotateClockwise') or 0)
                  if rotate_clockwise:
                      im = im.rotate(-rotate_clockwise, expand=True)

                  w, h = im.size
                  scale = min(1.0, 2400 / max(w, h))
                  if scale < 1:
                      im = im.resize((round(w * scale), round(h * scale)), Image.Resampling.LANCZOS)
                  im.save(out, 'WEBP', quality=86, method=6)
                  if not out.exists() or out.stat().st_size < 10_000:
                      raise RuntimeError(f'output too small: {out}')
                  downloaded += 1
              except Exception as exc:
                  if out.exists():
                      out.unlink()
                  failures.append((item, str(exc)))

          print(f"Downloaded: {downloaded}; existing: {skipped}; failed: {len(failures)}")
          if failures:
              print('\nUNAVAILABLE SOURCES:')
              for item, exc in failures:
                  kind = 'AUTH' if item.get('authRequired') else 'PUBLIC'
                  print(f"- [{kind}] {item['sourceName']} -> {item['localAsset']}: {exc}")
          PY

      - name: Commit newly imported public assets
        run: |
          if [ -z "$(git status --porcelain -- assets/media/signature/unit-layouts assets/media/elite/unit-layouts assets/media/signature/special-layouts assets/media/signature/stacking assets/media/penthouse-units)" ]; then
            echo 'No asset changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/media/signature/unit-layouts assets/media/elite/unit-layouts assets/media/signature/special-layouts assets/media/signature/stacking assets/media/penthouse-units
          git commit -m 'assets: import available Lumi unit layouts from Drive'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Sync latest main before page finalization
        run: git pull --rebase origin main

      - name: Finalize Signature layout pages
        run: |
          python -m py_compile scripts/finalize_signature_layout_pages.py
          python scripts/finalize_signature_layout_pages.py

      - name: Run focused layout and SEO QA
        run: |
          python -m json.tool assets/data/drive-special-layout-import.json >/dev/null
          python scripts/qa_visual_v7.py
          python scripts/qa_floorplans_v8_2.py
          python scripts/qa_layout_phase_integrity.py
          python scripts/qa_public_source_cleanup.py

      - name: Commit finalized layout pages
        run: |
          if [ -z "$(git status --porcelain -- layout-can-ho-lumi-signature/index.html can-ho-3-phong-ngu-lumi-hanoi/index.html duplex-penthouse-lumi-hanoi/index.html lumi-signature/index.html lumi-prestige/index.html lumi-elite/index.html)" ]; then
            echo 'No page changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add layout-can-ho-lumi-signature/index.html can-ho-3-phong-ngu-lumi-hanoi/index.html duplex-penthouse-lumi-hanoi/index.html lumi-signature/index.html lumi-prestige/index.html lumi-elite/index.html
          git commit -m 'content: finalize Signature layout coverage'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Validate registry coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          registry_paths = [
              Path('assets/data/drive-unit-layout-import.json'),
              Path('assets/data/drive-unit-layout-import-extra.json'),
              Path('assets/data/drive-special-layout-import.json'),
          ]
          items = []
          for path in registry_paths:
              items.extend(json.loads(path.read_text())['items'])

          signature_count = sum(1 for i in items if i['phase'] == 'signature')
          special_count = sum(1 for i in items if i['phase'] != 'signature' and i['phase'] != 'elite')
          phases = {}
          for item in items:
              phases[item['phase']] = phases.get(item['phase'], 0) + 1

          missing = [i for i in items if not Path(i['localAsset']).is_file() or Path(i['localAsset']).stat().st_size < 10_000]
          missing_public = [i for i in missing if not i.get('authRequired')]
          missing_auth = [i for i in missing if i.get('authRequired')]

          print('Registered:', len(items), 'assets', phases)
          print('Special CapitaLand assets:', special_count)
          print('Signature source catalog:', signature_count, '/ 51')
          print('Local assets present:', len(items) - len(missing), '/', len(items))

          if signature_count != 51:
              raise SystemExit(f'Expected 51 Signature source records, got {signature_count}')
          if missing_auth:
              print('Authenticated Drive assets awaiting local import:')
              for item in missing_auth:
                  print('-', item['sourceName'], '->', item['localAsset'])
          if missing_public:
              print('Unexpected missing public assets:')
              for item in missing_public:
                  print('-', item['sourceName'], '->', item['localAsset'])
              raise SystemExit(1)

          wrong_orientation = []
          for item in items:
              if not item.get('landscape'):
                  continue
              asset = Path(item['localAsset'])
              with Image.open(asset) as image:
                  if image.width <= image.height:
                      wrong_orientation.append((item['sourceName'], image.size))
          if wrong_orientation:
              raise SystemExit('Customer floorplans are not landscape: ' + repr(wrong_orientation))

          public_pages = [
              Path('mat-bang-lumi-hanoi/layout-dac-biet-lumi-signature/index.html'),
              Path('layout-can-ho-lumi-signature/index.html'),
              Path('lumi-signature/index.html'),
              Path('duplex-penthouse-lumi-hanoi/index.html'),
              Path('tien-ich-lumi-signature/index.html'),
          ]
          forbidden_public = ('stacking', 'đã bổ sung', 'dữ liệu gốc', 'registry', 'đã đưa vào repo')
          for page in public_pages:
              body = page.read_text(encoding='utf-8').casefold()
              for token in forbidden_public:
                  if token.casefold() in body:
                      raise SystemExit(f'Internal wording leaked to public page {page}: {token}')
          print('Customer-facing layout pages: wording and landscape orientation OK')
          PY

# 2026-09-11: retrigger import after recovering the interrupted layout task.
