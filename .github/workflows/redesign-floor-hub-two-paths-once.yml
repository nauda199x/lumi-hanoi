name: Redesign floor hub around two primary paths

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redesign-floor-hub-two-paths-once.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply two-path floor hub upgrade
        run: python scripts/upgrade_floor_hub_two_paths.py

      - name: Run full repository QA
        run: npm test

      - name: Commit two-path floor hub redesign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mat-bang-lumi-hanoi/index.html assets/css/floor-plan-hub.css
          git commit -m 'feat: make floor hub a two-path experience'
          git pull --rebase origin main
          git push origin HEAD:main
