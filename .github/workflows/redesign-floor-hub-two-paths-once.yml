name: Redesign floor hub around two primary paths

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redesign-floor-hub-two-paths-once.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild first-screen UX into two clear routes
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          page = Path('mat-bang-lumi-hanoi/index.html')
          html = page.read_text(encoding='utf-8')

          # SEO copy: describe both user intents explicitly.
          html = html.replace(
              '<title>Mặt bằng Lumi Hanoi: 9 tòa Signature, Prestige, Elite</title>',
              '<title>Mặt bằng Lumi Hanoi: Layout căn hộ & mặt bằng 9 tòa</title>'
          )
          html = re.sub(
              r'<meta name="description" content="[^"]*">',
              '<meta name="description" content="Tra cứu mặt bằng Lumi Hanoi theo 2 hướng: toàn bộ layout căn hộ 1PN–4PN, Duplex theo Signature–Prestige–Elite hoặc mặt bằng 9 tòa S1, S2, S3, S5, S6, P1, P2, E1, E2.">',
              html,
              count=1,
          )
          html = html.replace(
              '<meta property="og:title" content="Mặt bằng Lumi Hanoi: thư viện 9 tòa & layout căn hộ">',
              '<meta property="og:title" content="Mặt bằng Lumi Hanoi: Layout căn hộ & mặt bằng 9 tòa">'
          )
          html = html.replace(
              '<meta property="og:description" content="Tra cứu mặt bằng Lumi Hanoi theo 9 tòa hoặc mở nhánh Layout để xem căn hộ theo 1PN, 2PN, 3PN, 4PN.">',
              '<meta property="og:description" content="Chọn xem toàn bộ layout căn hộ hoặc đi thẳng vào mặt bằng 9 tòa Lumi Hanoi theo Signature, Prestige và Elite.">'
          )

          # Make the hero itself a binary decision instead of a row of five similar chips.
          hero_nav = '''<nav class="hub-jump hub-jump--two" aria-label="Hai cách xem mặt bằng Lumi Hanoi">
            <a class="hub-route hub-route--primary" href="/mat-bang-lumi-hanoi/layout-can-ho-lumi-hanoi/"><span class="hub-route-index">01</span><span><strong>Layout tất cả căn hộ</strong><small>1PN · 2PN · 3PN · 4PN · Duplex</small></span><span class="hub-route-arrow" aria-hidden="true">→</span></a>
            <a class="hub-route" href="#tower-all"><span class="hub-route-index">02</span><span><strong>Mặt bằng tất cả tòa nhà</strong><small>S1 · S2 · S3 · S5 · S6 · P1 · P2 · E1 · E2</small></span><span class="hub-route-arrow" aria-hidden="true">↓</span></a>
          </nav>'''
          html, n = re.subn(r'<nav class="hub-jump(?: [^"]*)?">.*?</nav>', hero_nav, html, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected one hero nav replacement, got {n}')

          # Avoid duplicate insertion on reruns.
          existing = re.compile(r'<!-- TWO-PATH-GATEWAY:START -->.*?<!-- TWO-PATH-GATEWAY:END -->', re.S)
          html = existing.sub('', html)

          gateway = '''<!-- TWO-PATH-GATEWAY:START -->
<section class="section floor-hub-gateway" aria-labelledby="floor-hub-choice-title">
  <div class="container">
    <div class="gateway-intro">
      <p class="eyebrow">Chọn cách xem</p>
      <h2 id="floor-hub-choice-title">Bạn muốn xem layout căn hộ hay mặt bằng tòa?</h2>
      <p>Hai nhu cầu khác nhau được tách thành hai đường đi riêng. Chọn một hướng bên dưới là tới đúng dữ liệu cần xem, không phải cuộn qua các phần không liên quan.</p>
    </div>

    <div class="floor-route-grid">
      <article class="floor-route-card floor-route-card--layout" id="layout-all">
        <div class="floor-route-head">
          <span class="floor-route-number">01</span>
          <div><p class="eyebrow">Theo loại căn hộ</p><h3>Layout tất cả căn hộ</h3></div>
        </div>
        <p class="floor-route-desc">Xem cách bố trí bên trong căn hộ. Thư viện tách đúng theo <strong>Signature · Prestige · Elite</strong>, không dùng layout khu này minh họa cho khu khác.</p>
        <a class="route-visual route-layout-visual" href="/mat-bang-lumi-hanoi/layout-can-ho-lumi-hanoi/" aria-label="Mở toàn bộ thư viện layout căn hộ Lumi Hanoi">
          <span><img src="/assets/media/signature/unit-layouts/signature-s1-s5-1br-a1.webp" width="1800" height="2400" alt="Layout căn hộ Lumi Signature" loading="eager" decoding="async"></span>
          <span><img src="/assets/media/prestige/unit-layouts/prestige-layout-22-1br-medium.webp" width="3200" height="4267" alt="Layout căn hộ Lumi Prestige" loading="lazy" decoding="async"></span>
          <span><img src="/assets/media/elite/unit-layouts/elite-layout-page-09.webp" width="1800" height="2400" alt="Layout căn hộ Lumi Elite" loading="lazy" decoding="async"></span>
        </a>
        <nav class="route-chip-grid" aria-label="Chọn layout theo số phòng ngủ">
          <a href="/can-ho-1-phong-ngu-lumi-hanoi/">1PN</a>
          <a href="/can-ho-2-phong-ngu-lumi-hanoi/">2PN</a>
          <a href="/can-ho-3-phong-ngu-lumi-hanoi/">3PN</a>
          <a href="/can-ho-4-phong-ngu-lumi-hanoi/">4PN</a>
          <a href="/duplex-penthouse-lumi-hanoi/">Duplex / Penthouse</a>
        </nav>
        <a class="btn btn-primary route-main-cta" href="/mat-bang-lumi-hanoi/layout-can-ho-lumi-hanoi/">Xem tất cả layout căn hộ <span aria-hidden="true">→</span></a>
      </article>

      <article class="floor-route-card floor-route-card--tower" id="tower-all">
        <div class="floor-route-head">
          <span class="floor-route-number">02</span>
          <div><p class="eyebrow">Theo tòa & tầng</p><h3>Mặt bằng tất cả tòa nhà</h3></div>
        </div>
        <p class="floor-route-desc">Xem vị trí căn, lõi thang và nhóm tầng của từng tòa. Chọn thẳng một trong <strong>9 tòa</strong> để mở mặt bằng chi tiết.</p>
        <a class="route-visual route-tower-visual" href="#signature" aria-label="Xem danh sách mặt bằng 9 tòa Lumi Hanoi">
          <img src="/assets/media/masterplan/lumi-hanoi-9-toa-so-do-tra-cuu.svg" width="1600" height="1200" alt="Sơ đồ 9 tòa Lumi Hanoi gồm Signature, Prestige và Elite" loading="eager" decoding="async">
        </a>
        <div class="tower-picker" aria-label="Chọn tòa Lumi Hanoi">
          <div class="tower-picker-phase"><strong>Signature</strong><nav><a href="/mat-bang-lumi-hanoi/lumi-signature/s1/">S1</a><a href="/mat-bang-lumi-hanoi/lumi-signature/s2/">S2</a><a href="/mat-bang-lumi-hanoi/lumi-signature/s3/">S3</a><a href="/mat-bang-lumi-hanoi/lumi-signature/s5/">S5</a><a href="/mat-bang-lumi-hanoi/lumi-signature/s6/">S6</a></nav></div>
          <div class="tower-picker-phase"><strong>Prestige</strong><nav><a href="/mat-bang-lumi-hanoi/lumi-prestige/p1/">P1</a><a href="/mat-bang-lumi-hanoi/lumi-prestige/p2/">P2</a></nav></div>
          <div class="tower-picker-phase"><strong>Elite</strong><nav><a href="/mat-bang-lumi-hanoi/lumi-elite/e1/">E1</a><a href="/mat-bang-lumi-hanoi/lumi-elite/e2/">E2</a></nav></div>
        </div>
        <a class="btn route-main-cta" href="#signature">Xem danh sách 9 tòa <span aria-hidden="true">↓</span></a>
      </article>
    </div>
  </div>
</section>
<!-- TWO-PATH-GATEWAY:END -->'''

          anchor = '</nav></div></header>'
          if anchor not in html:
              raise SystemExit('Hero end anchor not found')
          html = html.replace(anchor, anchor + gateway, 1)

          # The secondary S/E preview remains useful but is explicitly demoted from primary navigation.
          html = html.replace(
              '<p class="eyebrow">Layout căn hộ theo phân khu</p>\n        <h2 id="phase-unit-layouts-title">Xem ngay layout khu Signature và Elite</h2>',
              '<p class="eyebrow">Thư viện sâu theo phân khu</p>\n        <h2 id="phase-unit-layouts-title">Layout nổi bật Signature và Elite</h2>'
          )
          html = html.replace(
              'Trang tổng giờ hiển thị trực tiếp các mẫu tiêu biểu của khu S và khu E để không còn cảm giác thư viện chỉ có Prestige.',
              'Các mẫu tiêu biểu của khu S và khu E được giữ riêng để người cần tra cứu sâu có thể đối chiếu nhanh theo đúng phân khu.'
          )

          # Basic integrity checks.
          required = [
              'id="layout-all"', 'id="tower-all"', 'Layout tất cả căn hộ',
              'Mặt bằng tất cả tòa nhà', '/lumi-signature/s6/', '/lumi-prestige/p2/', '/lumi-elite/e2/'
          ]
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit(f'Missing required gateway markers: {missing}')
          if html.count('id="layout-all"') != 1 or html.count('id="tower-all"') != 1:
              raise SystemExit('Gateway ids must be unique')

          page.write_text(html, encoding='utf-8')

          css_path = Path('assets/css/floor-plan-hub.css')
          css = css_path.read_text(encoding='utf-8')
          css = re.sub(r'/\* TWO-PATH-GATEWAY:START \*/.*?/\* TWO-PATH-GATEWAY:END \*/', '', css, flags=re.S)
          css += r'''

/* TWO-PATH-GATEWAY:START */
.hub-jump--two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem;max-width:920px}
.hub-jump--two .hub-route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.8rem;min-height:76px;padding:.85rem 1rem;border-radius:16px;background:rgba(18,22,18,.42);text-align:left}
.hub-jump--two .hub-route--primary{background:rgba(255,255,255,.95);color:#1c201d;border-color:rgba(255,255,255,.95)}
.hub-route-index{display:grid;place-items:center;width:34px;height:34px;border:1px solid currentColor;border-radius:50%;font-size:.72rem;font-weight:800;opacity:.8}
.hub-route strong{display:block;font-size:1rem;line-height:1.2}.hub-route small{display:block;margin-top:.25rem;font-size:.72rem;line-height:1.3;opacity:.78}.hub-route-arrow{font-size:1.3rem}
.floor-hub-gateway{padding-top:clamp(2.4rem,5vw,4.8rem);padding-bottom:clamp(2.8rem,6vw,5.5rem);background:#f8f6f1}
.gateway-intro{max-width:820px;margin-bottom:1.7rem}.gateway-intro h2{margin:.2rem 0 .7rem;font-size:clamp(2rem,4.4vw,3.6rem);line-height:1.05;letter-spacing:-.035em}.gateway-intro>p:last-child{max-width:720px;line-height:1.7;color:var(--muted,#666)}
.floor-route-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.25rem;align-items:stretch}
.floor-route-card{display:flex;flex-direction:column;min-width:0;padding:clamp(1.15rem,2.2vw,1.65rem);border:1px solid var(--line,#d8d1c5);border-radius:24px;background:#fff;box-shadow:0 18px 48px rgba(25,29,25,.07);scroll-margin-top:92px}
.floor-route-card--layout{border-color:#c9c0b2}.floor-route-card--tower{background:#1f241f;color:#f6f2e8;border-color:#1f241f}.floor-route-card--tower .eyebrow,.floor-route-card--tower .floor-route-desc{color:#d7d4cc}.floor-route-card--tower .btn{border-color:#727970;color:#fff}.floor-route-card--tower .btn:hover{background:#fff;color:#1f241f}
.floor-route-head{display:flex;align-items:flex-start;gap:.9rem}.floor-route-number{display:grid;place-items:center;flex:0 0 auto;width:42px;height:42px;border:1px solid currentColor;border-radius:50%;font-size:.78rem;font-weight:800;opacity:.72}.floor-route-head .eyebrow{margin:0 0 .2rem}.floor-route-head h3{margin:0;font-size:clamp(1.8rem,3.1vw,2.55rem);line-height:1.05;letter-spacing:-.025em}.floor-route-desc{min-height:72px;margin:1rem 0 1.15rem;line-height:1.65;color:var(--muted,#666)}
.route-visual{display:block;overflow:hidden;margin-bottom:1rem;border-radius:17px;background:#f1eee8}.route-layout-visual{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;aspect-ratio:16/9;background:#d8d1c5}.route-layout-visual span{min-width:0;overflow:hidden;background:#fff}.route-layout-visual img{width:100%;height:100%;object-fit:contain;padding:.35rem}.route-tower-visual{aspect-ratio:16/9;background:#f2efe7}.route-tower-visual img{width:100%;height:100%;object-fit:contain}
.route-chip-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.4rem;margin-bottom:1rem}.route-chip-grid a{display:grid;place-items:center;min-height:42px;padding:.45rem .35rem;border:1px solid var(--line,#d8d1c5);border-radius:10px;color:var(--ink,#1c201d);font-size:.74rem;font-weight:800;text-align:center;text-decoration:none;background:#fbfaf7}.route-chip-grid a:last-child{grid-column:span 2}.route-chip-grid a:hover{background:#f0ece3}
.route-main-cta{display:flex;width:100%;min-height:50px;align-items:center;justify-content:space-between;margin-top:auto;padding-inline:1rem}
.tower-picker{display:grid;gap:.65rem;margin-bottom:1rem}.tower-picker-phase{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:.65rem}.tower-picker-phase>strong{font-size:.76rem;letter-spacing:.04em;color:#d7d4cc}.tower-picker-phase nav{display:flex;flex-wrap:wrap;gap:.35rem}.tower-picker-phase a{display:grid;place-items:center;min-width:42px;height:38px;padding:0 .5rem;border:1px solid #646b63;border-radius:9px;color:#fff;font-size:.78rem;font-weight:800;text-decoration:none;background:#2a302a}.tower-picker-phase a:hover,.tower-picker-phase a:focus-visible{background:#fff;color:#1f241f}
@media(max-width:900px){.hub-jump--two,.floor-route-grid{grid-template-columns:1fr}.floor-route-desc{min-height:0}.route-chip-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.route-chip-grid a:last-child{grid-column:span 2}}
@media(max-width:560px){.floor-hub-gateway{padding-top:2rem}.gateway-intro h2{font-size:2rem}.floor-route-card{border-radius:18px;padding:1rem}.floor-route-head h3{font-size:1.7rem}.route-layout-visual,.route-tower-visual{aspect-ratio:4/3}.route-chip-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.route-chip-grid a:last-child{grid-column:1/-1}.tower-picker-phase{grid-template-columns:1fr}.tower-picker-phase>strong{margin-top:.2rem}.hub-jump--two .hub-route{min-height:70px}.hub-route small{font-size:.68rem}}
/* TWO-PATH-GATEWAY:END */
'''
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Run full repository QA
        run: npm test

      - name: Commit two-path floor hub redesign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mat-bang-lumi-hanoi/index.html assets/css/floor-plan-hub.css
          git commit -m 'feat: make floor hub a two-path experience'
          git pull --rebase origin main
          git push origin HEAD:main
