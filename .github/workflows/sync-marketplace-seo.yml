name: Sync Marketplace SEO Pages

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_marketplace_seo.py"
      - "scripts/generate_rent_category_seo.py"
      - "scripts/strengthen_rent_hub_seo.py"
      - "scripts/normalize_marketplace_snippet_text.py"
      - ".github/workflows/sync-marketplace-seo.yml"

permissions:
  contents: write

concurrency:
  group: marketplace-seo-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate approved listing pages
        run: |
          python scripts/generate_marketplace_seo.py
          python scripts/generate_rent_category_seo.py
          python scripts/strengthen_rent_hub_seo.py
          python scripts/normalize_marketplace_snippet_text.py
      - name: Validate rental SEO generator syntax
        run: |
          python -m py_compile scripts/generate_rent_category_seo.py
          python -m py_compile scripts/strengthen_rent_hub_seo.py
          python -m py_compile scripts/normalize_marketplace_snippet_text.py
      - name: Commit generated SEO pages
        run: |
          PATHS="mua-ban-lumi-hanoi cho-thue-lumi-hanoi cho-thue-shop-chan-de-lumi-hanoi gia-can-ho-lumi-hanoi cho-thue-can-ho-1-phong-ngu-lumi-hanoi cho-thue-can-ho-2-phong-ngu-lumi-hanoi cho-thue-can-ho-3-phong-ngu-lumi-hanoi cho-thue-can-ho-4-phong-ngu-lumi-hanoi cho-thue-duplex-lumi-hanoi cho-thue-penthouse-lumi-hanoi cho-thue-lumi-signature cho-thue-lumi-prestige cho-thue-lumi-elite lumi-signature lumi-prestige lumi-elite assets/js/marketplace-list.js sitemap.xml sitemap-tin-dang.xml"
          if [ -z "$(git status --porcelain -- $PATHS)" ]; then
            echo "Marketplace SEO pages are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $PATHS
          git commit -m "Sync approved marketplace SEO pages"
          git push origin HEAD:main
