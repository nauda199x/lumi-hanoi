name: Sync Marketplace SEO Pages

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for the immediate marketplace SEO sync"
        required: false
        default: "manual"
        type: string
  push:
    branches: [main]
    paths:
      - "scripts/generate_marketplace_seo.py"
      - "scripts/templates/listing-detail.html.tpl"
      - "scripts/marketplace_inventory.py"
      - "scripts/generate_marketplace_seo_average.py"
      - "scripts/enhance_market_index.py"
      - "scripts/generate_sale_phase_seo.py"
      - "scripts/generate_sale_tower_seo.py"
      - "scripts/generate_floorplan_marketplace_bridge.py"
      - "scripts/finalize_marketplace_sitemap.py"
      - "scripts/generate_rent_category_seo.py"
      - "scripts/strengthen_rent_hub_seo.py"
      - "scripts/consolidate_rent_hub_serp.py"
      - "scripts/strengthen_sale_hub_seo.py"
      - "scripts/normalize_marketplace_snippet_text.py"
      - "scripts/dedupe_marketplace_seo.py"
      - "scripts/update_home_social_preview.py"
      - ".github/workflows/sync-marketplace-seo.yml"

permissions:
  contents: write

concurrency:
  group: marketplace-seo-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate approved listing pages
        run: |
          python scripts/generate_marketplace_seo_average.py
          python scripts/enhance_market_index.py
          python scripts/generate_rent_category_seo.py
          python scripts/strengthen_rent_hub_seo.py
          python scripts/normalize_marketplace_snippet_text.py
          python scripts/consolidate_rent_hub_serp.py
          python scripts/strengthen_sale_hub_seo.py
          python scripts/dedupe_marketplace_seo.py
          python scripts/finalize_marketplace_sitemap.py
          python scripts/generate_sale_phase_seo.py
          python scripts/generate_sale_tower_seo.py
          python scripts/generate_floorplan_marketplace_bridge.py
          python scripts/update_home_social_preview.py
      - name: Validate marketplace SEO generator syntax
        run: |
          python -m py_compile scripts/generate_marketplace_seo_average.py
          python -m py_compile scripts/enhance_market_index.py
          python -m py_compile scripts/generate_sale_phase_seo.py
          python -m py_compile scripts/generate_sale_tower_seo.py
          python -m py_compile scripts/generate_floorplan_marketplace_bridge.py
          python -m py_compile scripts/marketplace_inventory.py
          python -m py_compile scripts/finalize_marketplace_sitemap.py
          python -m py_compile scripts/generate_rent_category_seo.py
          python -m py_compile scripts/strengthen_rent_hub_seo.py
          python -m py_compile scripts/normalize_marketplace_snippet_text.py
          python -m py_compile scripts/consolidate_rent_hub_serp.py
          python -m py_compile scripts/strengthen_sale_hub_seo.py
          python -m py_compile scripts/dedupe_marketplace_seo.py
          python -m py_compile scripts/update_home_social_preview.py
      - name: Commit generated SEO pages
        run: |
          PATHS="index.html tin-dang-lumi-hanoi mua-ban-lumi-hanoi mua-ban-lumi-signature mua-ban-lumi-prestige mua-ban-lumi-elite mua-ban-toa-s1-lumi-hanoi mua-ban-toa-s2-lumi-hanoi mua-ban-toa-s3-lumi-hanoi mua-ban-toa-s5-lumi-hanoi mua-ban-toa-s6-lumi-hanoi mua-ban-toa-p1-lumi-hanoi mua-ban-toa-p2-lumi-hanoi mua-ban-toa-e1-lumi-hanoi mua-ban-toa-e2-lumi-hanoi cho-thue-lumi-hanoi cho-thue-shop-chan-de-lumi-hanoi gia-can-ho-lumi-hanoi cho-thue-can-ho-1-phong-ngu-lumi-hanoi cho-thue-can-ho-2-phong-ngu-lumi-hanoi cho-thue-can-ho-3-phong-ngu-lumi-hanoi cho-thue-can-ho-4-phong-ngu-lumi-hanoi cho-thue-duplex-lumi-hanoi cho-thue-penthouse-lumi-hanoi cho-thue-lumi-signature cho-thue-lumi-prestige cho-thue-lumi-elite lumi-signature lumi-prestige lumi-elite mat-bang-lumi-hanoi/lumi-signature/s1/index.html mat-bang-lumi-hanoi/lumi-signature/s2/index.html mat-bang-lumi-hanoi/lumi-signature/s3/index.html mat-bang-lumi-hanoi/lumi-signature/s5/index.html mat-bang-lumi-hanoi/lumi-signature/s6/index.html mat-bang-lumi-hanoi/lumi-prestige/p1/index.html mat-bang-lumi-hanoi/lumi-prestige/p2/index.html mat-bang-lumi-hanoi/lumi-elite/e1/index.html mat-bang-lumi-hanoi/lumi-elite/e2/index.html assets/js/marketplace-list.js sitemap.xml sitemap-tin-dang.xml"
          if [ -z "$(git status --porcelain -- $PATHS)" ]; then
            echo "Marketplace SEO pages, floor-plan bridges, sitemap and homepage social preview are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $PATHS
          git commit -m "Sync approved marketplace SEO pages"
          git pull --rebase origin main
          git push origin HEAD:main
