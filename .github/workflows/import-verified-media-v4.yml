name: Import verified Lumi media V4

on:
  push:
    branches:
      - codex/extract-and-integrate-lumi-hanoi-media-assets
    paths:
      - .github/workflows/import-verified-media-v4.yml

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/extract-and-integrate-lumi-hanoi-media-assets
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Import verified source media
        run: python scripts/import_verified_media_v4.py

      - name: Verify expected production assets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            assets/media/home/lumi-hanoi-hero.webp
            assets/media/home/lumi-hanoi-streetscape.webp
            assets/media/masterplan/lumi-hanoi-masterplan.webp
            assets/media/signature/lumi-signature-landscape.webp
            assets/media/signature/lumi-signature-water-garden.webp
            assets/media/signature/lumi-signature-pool.webp
            assets/media/prestige/lumi-prestige-hero.webp
            assets/media/prestige/lumi-prestige-aurora-pool.webp
            assets/media/prestige/lumi-prestige-garden.webp
            assets/media/layouts/lumi-prestige-typical-floor.webp
            assets/media/elite/lumi-elite-facade.webp
            assets/media/elite/lumi-elite-aurora-pool.webp
            assets/media/elite/lumi-elite-lobby-e1.webp
            assets/media/layouts/lumi-elite-masterplan.webp
            assets/media/og/lumi-hanoi-og.webp
          )
          for f in "${required[@]}"; do
            test -s "$f" || { echo "Missing/empty asset: $f" >&2; exit 1; }
          done
          find assets/media -type f \( -name '*.webp' -o -name '*.jpg' -o -name '*.png' \) -print0 | xargs -0 -r du -h

      - name: Commit imported binaries and remove one-shot importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/import_verified_media_v4.py
          rm -f .github/workflows/import-verified-media-v4.yml
          git add -A assets/media scripts/import_verified_media_v4.py .github/workflows/import-verified-media-v4.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add verified Lumi Hanoi project media assets"
          git push origin HEAD:codex/extract-and-integrate-lumi-hanoi-media-assets
