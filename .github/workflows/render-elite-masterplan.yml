name: Render Elite Masterplan

on:
  push:
    branches: [main]
    paths:
      - "scripts/render_elite_masterplan.py"

permissions:
  contents: write

concurrency:
  group: render-elite-masterplan
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow
        run: python -m pip install --upgrade pillow
      - name: Render Lumi Elite masterplan
        run: python scripts/render_elite_masterplan.py
      - name: Validate render
        run: |
          git diff --check
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p = Path('assets/media/floor-plans/lumi-elite-masterplan-v2.webp')
          assert p.exists(), 'render missing'
          im = Image.open(p)
          assert im.size == (1800, 1200), im.size
          assert p.stat().st_size < 500_000, p.stat().st_size
          print('render ok', im.size, p.stat().st_size)
          PY
          grep -q "lumi-elite-masterplan-v2.webp" mat-bang-lumi-hanoi/lumi-elite/index.html
          grep -q "lumi-elite-masterplan-v2.webp" mat-bang-lumi-hanoi/index.html
      - name: Commit render
        run: |
          PATHS="assets/media/floor-plans/lumi-elite-masterplan-v2.webp mat-bang-lumi-hanoi/lumi-elite/index.html mat-bang-lumi-hanoi/index.html"
          if [ -z "$(git status --porcelain -- $PATHS)" ]; then
            echo "Elite masterplan already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $PATHS
          git commit -m "feat: render premium Lumi Elite masterplan"
          git pull --rebase origin main
          git push origin HEAD:main
