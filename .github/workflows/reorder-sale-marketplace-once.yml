name: Reorder sale marketplace sections once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reorder-sale-marketplace-once.yml'

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Move discovery clusters below marketplace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mua-ban-lumi-hanoi/index.html')
          text = path.read_text(encoding='utf-8')

          start_marker = '<!-- SALE-PHASE-CLUSTER:START -->'
          end_marker = '<!-- SALE-UNIT-CLUSTER:END -->'
          marketplace_marker = '<section id="quy-can"'
          article_marker = '<article class="article-body" aria-labelledby="guide-title">'

          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('Expected exactly one sale cluster block')
          if text.count(marketplace_marker) != 1 or text.count(article_marker) != 1:
              raise SystemExit('Expected exactly one marketplace and guide marker')

          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          clusters = text[start:end]

          without_clusters = text[:start] + text[end:]
          insert_at = without_clusters.index(article_marker)

          # Keep marketplace first, then SEO/discovery navigation clusters, then the long guide.
          updated = without_clusters[:insert_at] + clusters + '\n' + without_clusters[insert_at:]

          if updated.index(marketplace_marker) > updated.index(start_marker):
              raise SystemExit('Marketplace must appear before sale clusters')
          if updated.index(end_marker) > updated.index(article_marker):
              raise SystemExit('Sale clusters must remain before the guide article')

          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit page update and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mua-ban-lumi-hanoi/index.html
          git rm .github/workflows/reorder-sale-marketplace-once.yml
          git commit -m "Move sale discovery sections below marketplace"
          git push origin main
