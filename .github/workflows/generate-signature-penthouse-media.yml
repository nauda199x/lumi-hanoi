name: Generate Signature penthouse media

on:
  push:
    branches:
      - feat/signature-penthouse-seo-v8-4

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/signature-penthouse-seo-v8-4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate WebP from verified PDFs
        run: |
          python -m pip install --disable-pip-version-check pymupdf pillow requests
          python scripts/generate_signature_penthouse_media.py
      - name: Commit generated media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media/signature/penthouse/*.webp
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "media: generate optimized Signature penthouse WebP"
          git push origin HEAD:feat/signature-penthouse-seo-v8-4
