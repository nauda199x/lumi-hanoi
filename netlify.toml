[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "http://lumi-hanoi.com/*"
  to = "https://lumi-hanoi.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.lumi-hanoi.com/*"
  to = "https://lumi-hanoi.com/:splat"
  status = 301
  force = true
