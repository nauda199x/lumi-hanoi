[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/toa-s1-lumi-hanoi/*"
  to = "/toa-signature-1-lumi-hanoi/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/toa-s2-lumi-hanoi/*"
  to = "/toa-signature-2-lumi-hanoi/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/toa-s3-lumi-hanoi/*"
  to = "/toa-signature-3-lumi-hanoi/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/toa-s5-lumi-hanoi/*"
  to = "/toa-signature-5-lumi-hanoi/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/toa-s6-lumi-hanoi/*"
